name: knowledge checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check DECISIONS
        run: python3 tools/check-decisions.py
      - name: Check API reference is up to date
        run: python3 tools/build-api-reference.py --check
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
